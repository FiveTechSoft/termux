<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#141414">
<title>FiveTech Agent</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #141414; color: #fff;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 15px; display: flex; flex-direction: row;
  height: 100vh; overflow: hidden;
}

/* ── sidebar de agentes ── */
#sidebar {
  width: 210px; flex-shrink: 0; background: #1c1c1c;
  border-right: 2px solid #303030;
  display: flex; flex-direction: column;
}
#sidebar.hidden { display: none; }
#sb-header {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px; border-bottom: 2px solid #2c2c2c;
}
#sb-header .t { font-size: 11px; font-weight: 700; color: #b0b0b0;
  letter-spacing: 0.09em; text-transform: uppercase; flex: 1; }
.sb-btn {
  background: #2a2a2a; border: 1px solid #3a3a3a; color: #ccc;
  border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer;
}
.sb-btn:hover { background: #353535; color: #fff; }
.sb-btn.on { background: #10b981; border-color: #10b981; color: #062b1f; font-weight: 700; }
#agent-list { flex: 1; overflow-y: auto; }
#agent-list::-webkit-scrollbar { width: 4px; }
#agent-list::-webkit-scrollbar-thumb { background: #404040; border-radius: 2px; }
.agent-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; cursor: pointer; border-left: 3px solid transparent;
}
.agent-item:hover { background: #232323; }
.agent-item.sel { background: #25324a; border-left-color: #1d9bf0; }
.agent-item .dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.agent-item .info { flex: 1; min-width: 0; }
.agent-item .name { font-size: 13px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-item .model { font-size: 11px; color: #888;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-item .busy-ind { color: #10b981; font-size: 12px; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.agent-item .del {
  color: #666; font-size: 13px; padding: 0 2px; display: none;
  background: none; border: none; cursor: pointer;
}
.agent-item:hover .del { display: block; }
.agent-item .del:hover { color: #f48771; }

/* ── columna principal ── */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: #1c1c1c;
  border-bottom: 2px solid #303030; flex-shrink: 0;
}
#toolbar .title { font-weight: 600; font-size: 15px; color: #efefef; }
#toolbar .title span { color: #10b981; }
#toolbar .spacer { flex: 1; }
.tb-btn {
  background: #2a2a2a; border: 1px solid #3a3a3a; color: #ccc;
  border-radius: 4px; padding: 4px 10px; font-size: 12px;
  cursor: pointer; white-space: nowrap;
}
.tb-btn:hover { background: #353535; color: #fff; }
#role-bar {
  flex-shrink: 0; padding: 5px 12px; background: #181818;
  border-bottom: 1px solid #2c2c2c; font-size: 12px; color: #8fc3e8;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#role-bar b { color: #efefef; }
#team-desc {
  font-size: 12px; color: #8fc3e8; background: #101c2b;
  border: 1px solid #2b5a8a; border-radius: 4px; padding: 3px 10px;
  max-width: 28vw; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; display: none; cursor: pointer;
}
#model-tag {
  font-size: 12px; color: #10b981; background: #1e1e1e;
  border: 1px solid #10b981; border-radius: 4px; padding: 3px 10px;
  cursor: pointer; max-width: 30vw; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}

#messages {
  flex: 1; overflow-y: auto; padding: 10px 8px 24px;
  display: flex; flex-direction: column; gap: 8px;
}
#messages::-webkit-scrollbar { width: 5px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
.msg {
  padding: 9px 12px; border-radius: 5px; line-height: 1.6;
  word-break: break-word; font-size: 14px; position: relative;
}
.msg.user {
  background: #0078d4; color: #fff; align-self: flex-end;
  max-width: 92%; white-space: pre-wrap; font-weight: 500; padding-right: 38px;
}
.msg.bot { background: #1e1e1e; border-left: 3px solid #10b981; }
.msg.peer {
  background: #181818; color: #b8c4d0; font-size: 13px;
  border-left: 3px dashed #3a5a7a; white-space: pre-wrap;
}
.msg.sys {
  background: #101c2b; color: #8fc3e8; font-size: 13px;
  padding: 7px 12px; border-left: 2px solid #2b5a8a;
  font-family: 'Cascadia Code', 'Consolas', monospace; white-space: pre-wrap;
}
.msg.err {
  background: #2b1010; color: #f48771; font-size: 13px;
  padding: 7px 12px; border-left: 2px solid #8a3a3a; white-space: pre-wrap;
}
.msg:hover .copy-btn { opacity: 1; }
.copy-btn {
  position: absolute; top: 5px; right: 6px; opacity: 0;
  transition: opacity 0.15s; background: rgba(255,255,255,0.12);
  border: none; border-radius: 4px; color: #bbb; font-size: 11px;
  padding: 2px 7px; cursor: pointer; line-height: 1.7; user-select: none;
}
.copy-btn:hover { background: rgba(255,255,255,0.22); color: #fff; }
.copy-btn.ok { color: #4ec94e; }
.usage { color: #666; font-size: 11px; margin-top: 6px; font-family: monospace; }
.ts { color: #555; font-size: 10px; text-align: right; font-family: monospace; margin-top: 2px; }
.msg pre {
  background: #0d0d0d; border: 1px solid #2c2c2c; border-radius: 4px;
  padding: 8px 10px; overflow-x: auto; margin: 6px 0;
  font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 13px;
}
.msg code {
  background: #0d0d0d; border-radius: 3px; padding: 1px 5px;
  font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 13px;
}
.msg pre code { background: none; padding: 0; }
.msg h1, .msg h2, .msg h3 { margin: 10px 0 6px; line-height: 1.3; }
.msg h1 { font-size: 18px; } .msg h2 { font-size: 16px; } .msg h3 { font-size: 15px; }
.msg ul, .msg ol { margin: 4px 0 4px 22px; }
.msg a { color: #4da3ff; }
.msg table { border-collapse: collapse; margin: 6px 0; }
.msg th, .msg td { border: 1px solid #3a3a3a; padding: 4px 10px; font-size: 13px; }
.msg th { background: #252525; }
#thinking {
  display: none; color: #888; font-style: italic;
  padding: 6px 12px; font-size: 13px;
}

#input-area {
  flex-shrink: 0; background: #1c1c1c; border-top: 2px solid #303030;
  padding: 8px; display: flex; gap: 8px; align-items: flex-end;
}
#prompt {
  flex: 1; background: #141414; color: #fff; border: 1px solid #3a3a3a;
  border-radius: 5px; padding: 8px 10px; font-size: 14px;
  font-family: inherit; resize: none; max-height: 140px; outline: none;
}
#prompt:focus { border-color: #1d9bf0; }
#send-btn {
  background: #0078d4; border: none; color: #fff; border-radius: 5px;
  padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
}
#send-btn:hover { background: #1481d6; }
#send-btn.cancel { background: #a1260d; }
#send-btn:disabled { background: #333; color: #777; cursor: default; }

#cmd-list {
  position: absolute; bottom: 60px; left: 10px; right: 10px;
  background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 6px;
  max-height: 260px; overflow-y: auto; display: none; z-index: 20;
}
#cmd-list .cmd-item { padding: 8px 12px; cursor: pointer; font-size: 13px; }
#cmd-list .cmd-item:hover, #cmd-list .cmd-item.sel { background: #094771; }
#cmd-list .cmd-item .desc { color: #888; margin-left: 8px; }

/* ── modal nuevo agente ── */
#modal-bg, #team-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center; z-index: 30;
}
#modal-bg.open, #team-bg.open { display: flex; }
#modal {
  background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 8px;
  padding: 18px; width: 90%; max-width: 420px;
  display: flex; flex-direction: column; gap: 10px;
}
#modal h3 { font-size: 15px; }
#modal input, #modal textarea {
  background: #141414; color: #fff; border: 1px solid #3a3a3a;
  border-radius: 5px; padding: 8px 10px; font-size: 14px;
  font-family: inherit; outline: none; resize: none;
}
#modal input:focus, #modal textarea:focus { border-color: #1d9bf0; }
#modal .row { display: flex; gap: 8px; justify-content: flex-end; }
.msg.tool {
  background: #0d1a16; color: #9fd8c9; font-size: 12px;
  border-left: 2px solid #10b981; white-space: pre-wrap;
  font-family: 'Cascadia Code', 'Consolas', monospace; padding: 6px 12px;
}
#ask-bg, #skills-bg, #files-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center; z-index: 30;
}
#ask-bg.open, #skills-bg.open, #files-bg.open { display: flex; }
#skills-list, #files-list {
  max-height: 40vh; overflow-y: auto; display: flex;
  flex-direction: column; gap: 6px;
}
.skill-item, .file-item {
  background: #141414; border: 1px solid #3a3a3a; border-radius: 5px;
  padding: 8px 10px; font-size: 13px; cursor: pointer;
}
.skill-item:hover, .file-item:hover { border-color: #1d9bf0; }
.skill-item .sk-name { font-weight: 600; color: #10b981; }
.skill-item .sk-desc { color: #999; font-size: 12px; margin-top: 2px; }
.skill-item.off .sk-name { color: #777; }
.skill-item .sk-actions { float: right; }
#file-view {
  background: #0d0d0d; border: 1px solid #2c2c2c; border-radius: 5px;
  padding: 8px 10px; font-family: 'Cascadia Code', monospace; font-size: 12px;
  max-height: 30vh; overflow: auto; white-space: pre-wrap; display: none;
}
#ask-opts { display: flex; flex-direction: column; gap: 8px; }
#ask-opts .tb-btn { padding: 8px 12px; font-size: 14px; text-align: left; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sb-header">
    <div class="t">Agentes</div>
    <button class="sb-btn" id="btn-skills" title="Skills del equipo">📚</button>
    <button class="sb-btn" id="btn-ambient" title="Modo ambiente: los agentes hablan solos cada cierto tiempo">⏵</button>
    <button class="sb-btn" id="btn-team" title="Diseñar equipo con IA">✨</button>
    <button class="sb-btn" id="btn-new" title="Nuevo agente">+</button>
  </div>
  <div id="agent-list"></div>
</div>

<div id="main">
  <div id="toolbar">
    <button class="tb-btn" id="btn-sb" title="Mostrar/ocultar agentes">☰</button>
    <div class="title">FiveTech <span>Agent</span></div>
    <div id="model-tag" title="Cambiar modelo del agente actual">…</div>
    <div id="team-desc" title="Objetivo del grupo de trabajo"></div>
    <div class="spacer"></div>
    <button class="tb-btn" id="btn-files" title="Archivos del workspace">📁</button>
    <button class="tb-btn" id="btn-clear" title="Limpiar chat del agente actual">Clear</button>
  </div>
  <div id="role-bar"></div>

  <div id="messages"></div>
  <div id="thinking">Thinking…</div>

  <div id="input-area">
    <textarea id="prompt" rows="1" placeholder="Escribe tu mensaje…  (/ para comandos)"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<div id="cmd-list"></div>

<div id="modal-bg">
  <div id="modal">
    <h3>Nuevo agente</h3>
    <input id="na-name" placeholder="Nombre (ej. Coder)" maxlength="24">
    <textarea id="na-role" rows="3" placeholder="Rol / system prompt (ej. Experto en JavaScript, escribe y revisa código)"></textarea>
    <input id="na-model" placeholder="Modelo (vacío = hy3-free)">
    <div class="row">
      <button class="tb-btn" id="na-cancel">Cancelar</button>
      <button class="tb-btn" id="na-ok" style="background:#0078d4;color:#fff;border-color:#0078d4">Crear</button>
    </div>
  </div>
</div>

<div id="team-bg">
  <div id="modal">
    <h3>✨ Nuevo equipo</h3>
    <textarea id="tm-topic" rows="3" placeholder="¿Para qué objetivo? (ej. desarrollar una web de ventas, implantar un ERP)"></textarea>
    <div class="row">
      <button class="tb-btn" id="tm-cancel">Cancelar</button>
      <button class="tb-btn" id="tm-ok" style="background:#0078d4;color:#fff;border-color:#0078d4">Diseñar</button>
    </div>
  </div>
</div>

<div id="skills-bg">
  <div id="modal" style="max-width:520px">
    <h3>📚 Skills del equipo</h3>
    <div id="skills-list"></div>
    <h3 style="font-size:13px;color:#999">Nuevo skill</h3>
    <input id="sk-name" placeholder="nombre (sin espacios)" maxlength="30">
    <input id="sk-desc" placeholder="descripción corta">
    <input id="sk-triggers" placeholder="triggers regex separados por coma (ej. revisa,review)">
    <textarea id="sk-body" rows="4" placeholder="Instrucciones del skill (markdown). Se inyectan como system prompt al activarse."></textarea>
    <div class="row">
      <button class="tb-btn" id="sk-add">Añadir</button>
      <button class="tb-btn" id="sk-close">Cerrar</button>
    </div>
  </div>
</div>

<div id="files-bg">
  <div id="modal" style="max-width:520px">
    <h3>📁 Workspace</h3>
    <div id="files-list"></div>
    <pre id="file-view"></pre>
    <div class="row">
      <button class="tb-btn" id="fl-download">Descargar todo (.txt)</button>
      <button class="tb-btn" id="fl-close">Cerrar</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ================= Config ================= */
const CFG_KEY = 'termux-agent-config';
const AGENTS_KEY = 'termux-agent-agents';
const TEAM_KEY = 'termux-agent-team';
const CURRENT_KEY = 'termux-agent-current';
const PROMPT_HIST_KEY = 'termux-agent-prompts';
const DEFAULT_ENDPOINT = 'https://api.fivetechsoft.com/zen/v1';
const FREE_MODELS = ['hy3-free', 'laguna-s-2.1-free', 'nemotron-3-ultra-free',
                     'nemotron-3.5-lightning-free', 'mimo-v2.5-free', 'deepseek-v4-flash-free'];
const PALETTE = ['#1d9bf0', '#00ba7c', '#f91880', '#ff7a00', '#7856ff', '#e7b008'];
const ASK_BUDGET = 8;          // máx. consultas entre agentes por turno de usuario
const HIST_MSGS = 12;          // mensajes de historial que ve cada agente

const ASK_PROMPT =
  'Puedes hablar con CUALQUIER agente del equipo. Para preguntarles escribe EXACTAMENTE:\n' +
  '[[ASK:Nombre]]\ntu pregunta\n[[/ASK]]\n' +
  'Ejemplo:\n[[ASK:Coder]]\nRevisa esta función, ¿ves algún bug?\n[[/ASK]]\n' +
  'Usa el Nombre tal cual aparece en Equipo. Varios ASK si hace falta.\n' +
  'Si el usuario saluda al equipo, pide opiniones o se dirige a varios, DEBES lanzar un ASK a cada uno ANTES de responder.\n' +
  'No inventes lo que dirían: pregúntales. Luego resume al usuario.\n' +
  'NUNCA te consultes a ti mismo: el Nombre del ASK debe ser el de OTRO agente del Equipo.';

function loadCfg() {
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch (e) { return {}; }
}
function saveCfg(c) { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
const cfg = loadCfg();
const endpoint = () => cfg.endpoint || DEFAULT_ENDPOINT;
const apiKey = () => cfg.apiKey || 'public';

/* ================= Estado ================= */
let agents = [];        // {id,name,role,model,color,level,reports,leads,msgs:[{r,t,usage}],busy}
let currentId = null;
let askBudget = ASK_BUDGET;
let abortCtrl = null;
let promptHistory = [];
let promptHistIdx = -1;

const $ = id => document.getElementById(id);
const messagesEl = $('messages'), promptEl = $('prompt'), sendBtn = $('send-btn');
const thinkingEl = $('thinking'), cmdList = $('cmd-list'), modelTag = $('model-tag');
const agentListEl = $('agent-list');

const cur = () => agents.find(a => a.id === currentId) || null;

function nextColor() { return PALETTE[agents.length % PALETTE.length]; }
function uid() { return 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

function newAgent(name, role, mdl) {
  const a = {
    id: uid(), name: name.trim(), role: role.trim(),
    model: (mdl || '').trim() || 'hy3-free',
    color: nextColor(), level: 0, reports: '', leads: '',
    msgs: [], busy: false
  };
  agents.push(a);
  saveAgents();
  return a;
}

function saveAgents() {
  try {
    localStorage.setItem(AGENTS_KEY, JSON.stringify(agents.map(a => ({
      id: a.id, name: a.name, role: a.role, model: a.model, color: a.color,
      level: a.level, reports: a.reports, leads: a.leads,
      msgs: a.msgs.slice(-60)
    }))));
    localStorage.setItem(CURRENT_KEY, currentId || '');
  } catch (e) {}
}

function loadAgents() {
  try {
    const arr = JSON.parse(localStorage.getItem(AGENTS_KEY) || '[]');
    if (Array.isArray(arr) && arr.length) {
      agents = arr.map(a => Object.assign(a, { busy: false }));
      currentId = localStorage.getItem(CURRENT_KEY) || agents[0].id;
      if (!cur()) currentId = agents[0].id;
      return;
    }
  } catch (e) {}
  const a = newAgent('Assistant', 'Asistente general: responde preguntas, escribe y explica código, coordina al equipo si lo hay.', 'hy3-free');
  currentId = a.id;
}

/* ================= Utilidades ================= */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderMd(src) {
  const blocks = [];
  let s = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
    return ' B' + (blocks.length - 1) + ' ';
  });
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\*([^*\n]+)\*/g, '<i>$1</i>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = s.split('\n');
  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (/^ B\d+ $/.test(ln.trim())) { closeList(); out.push(ln.trim()); continue; }
    const h = ln.match(/^(#{1,3})\s+(.*)$/);
    if (h) { closeList(); out.push('<h' + h[1].length + '>' + h[2] + '</h' + h[1].length + '>'); continue; }
    if (/^\s*---+\s*$/.test(ln)) { closeList(); out.push('<hr>'); continue; }
    const ul = ln.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + ul[1] + '</li>'); continue; }
    const ol = ln.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + ol[1] + '</li>'); continue; }
    closeList();
    out.push(ln === '' ? '' : ln + '<br>');
  }
  closeList();
  let html = out.join('\n');
  html = html.replace(/ B(\d+) /g, (m, i) => blocks[+i]);
  return html;
}

/* ================= Render ================= */
function fmtTs(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function bubbleEl(msg) {
  const div = document.createElement('div');
  div.className = 'msg ' + msg.r;
  div.dataset.raw = msg.t;
  if (msg.r === 'bot') div.innerHTML = renderMd(msg.t);
  else div.textContent = msg.t;
  if (msg.usage) {
    const u = document.createElement('div');
    u.className = 'usage';
    u.textContent = msg.usage;
    div.appendChild(u);
  }
  if (msg.ts) {
    const t = document.createElement('div');
    t.className = 'ts';
    t.textContent = fmtTs(msg.ts);
    div.appendChild(t);
  }
  const cp = document.createElement('button');
  cp.className = 'copy-btn'; cp.textContent = '⎘'; cp.title = 'Copiar';
  cp.onclick = () => {
    navigator.clipboard.writeText(div.dataset.raw).then(() => {
      cp.textContent = '✓'; cp.classList.add('ok');
      setTimeout(() => { cp.textContent = '⎘'; cp.classList.remove('ok'); }, 1200);
    });
  };
  div.appendChild(cp);
  return div;
}

function renderChat() {
  messagesEl.innerHTML = '';
  const a = cur();
  if (!a) return;
  for (const m of a.msgs) messagesEl.appendChild(bubbleEl(m));
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMsgTo(agent, msg) {
  if (!msg.ts) msg.ts = Date.now();
  agent.msgs.push(msg);
  saveAgents();
  if (agent.id === currentId) {
    messagesEl.appendChild(bubbleEl(msg));
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  return msg;
}

      '<div class="info"><div class="name"></div><div class="model"></div></div>';
    item.querySelector('.name').textContent = a.name + lvl;
    item.querySelector('.model').textContent = a.model;

      const b = document.createElement('span');
      b.className = 'busy-ind'; b.textContent = '●';
      item.appendChild(b);
    }
    const edit = document.createElement('button');
    edit.className = 'del'; edit.textContent = '✎'; edit.title = 'Editar agente';
    edit.onclick = e => {
      e.stopPropagation();
      openAgentModal(a);
    };
    item.appendChild(edit);
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = 'Eliminar agente';
    del.onclick = e => {
      e.stopPropagation();
      if (agents.length <= 1) { addMsgTo(a, { r: 'sys', t: 'Debe quedar al menos un agente.' }); return; }

      agents = agents.filter(x => x.id !== a.id);
      if (currentId === a.id) currentId = agents[0].id;
      saveAgents(); renderSidebar(); renderChat(); updateModelTag(); updateRoleBar();

    item.appendChild(del);

/* ================= Prompts de agente ================= */
function roster(exceptId) {
  const others = agents.filter(a => a.id !== exceptId);
  if (!others.length) return '';
  return 'Equipo:\n' + others.map(a => {
    let s = '- ' + a.name;
    if (a.level) s += ' [L' + a.level + ']';
    if (a.reports) s += ' reporta a ' + a.reports;
    if (a.leads) s += ' dirige a ' + a.leads;
    s += ': ' + a.role.slice(0, 90);
    return s;
  }).join('\n') + '\n\n';
}

function fullSystem(agent, allowAsk) {
  let s = agent.role;
  if (agents.length > 1) s += '\n\n' + roster(agent.id);
  if (agents.length > 1) {
    s += allowAsk ? ASK_PROMPT
                  : 'Te escribe otro agente del equipo. Responde directo y breve. No uses ASK.';
    s += '\n\n';
  }
  s += toolsSystem() + skillsSystem();
  if (agent.memory) s += 'Tu memoria persistente:\n' + agent.memory + '\n\n';
  s += 'Responde en el idioma del usuario.';
  return s;
}

function packHistory(agent, newUserText) {
  const lines = agent.msgs.slice(-HIST_MSGS).map(m => {
    const p = m.r === 'user' ? 'Usuario' : m.r === 'bot' ? agent.name : m.r === 'peer' ? 'Equipo' : null;
    return p ? p + ': ' + m.t : null;
  }).filter(Boolean);
  lines.push('Usuario: ' + newUserText);
  return lines.join('\n\n');
}

/* ================= Red: streaming con fallback silencioso ================= */
async function fetchStream(m, messages, onDelta, signal) {
  const resp = await fetch(endpoint() + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey() },
    body: JSON.stringify({ model: m, messages, max_tokens: 4096, stream: true }),
    signal
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const ctype = resp.headers.get('content-type') || '';
  if (!ctype.includes('event-stream')) {
    const data = await resp.json();
    const txt = data.choices?.[0]?.message?.content || '';
    if (txt) onDelta(txt);
    return data.usage || null;
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', usage = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line.startsWith('data:')) continue;
      const payload = line.slice(5).trim();
      if (payload === '[DONE]') continue;
      try {
        const j = JSON.parse(payload);
        const d = j.choices?.[0]?.delta?.content;
        if (d) onDelta(d);
        if (j.usage) usage = j.usage;
      } catch (e) {}
    }
  }
  return usage;
}

/* Llama a un agente con streaming; devuelve {text, usage, usedModel} o null si falló todo */
async function callAgent(agent, userText, allowAsk, signal) {
  const sys = { role: 'system', content: fullSystem(agent, allowAsk) };
  const usr = { role: 'user', content: packHistory(agent, userText) };
  const candidates = [agent.model].concat(FREE_MODELS.filter(m => m !== agent.model));

  let div = null, acc = '', usage = null;
  const isView = agent.id === currentId;

  for (const m of candidates) {
    div = null; acc = ''; usage = null;
    try {
      usage = await fetchStream(m, [sys, usr], delta => {
        if (!div) {
          thinkingEl.style.display = 'none';
          if (isView) {
            div = bubbleEl({ r: 'bot', t: '' });
            messagesEl.appendChild(div);
          } else div = true;
        }
        acc += delta;
        if (div !== true) {
          div.dataset.raw = acc;
          div.innerHTML = renderMd(acc);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }, signal);
      if (acc) {
        return { text: acc, usage, usedModel: m, liveDiv: div !== true ? div : null };
      }
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      if (div && div !== true && !acc) div.remove();
      /* siguiente modelo */
    }
  }
  if (div && div !== true && !acc) div.remove();
  return null;
}

/* ================= Workspace virtual (VFS) ================= */
const VFS_KEY = 'termux-agent-vfs';
const TODO_KEY = 'termux-agent-todo';
function vfsLoad() { try { return JSON.parse(localStorage.getItem(VFS_KEY) || '{}'); } catch (e) { return {}; } }
function vfsSave(fs) { try { localStorage.setItem(VFS_KEY, JSON.stringify(fs)); } catch (e) {} }

/* ================= Skills ================= */
const SKILLS_KEY = 'termux-agent-skills';
function skills() { try { return JSON.parse(localStorage.getItem(SKILLS_KEY) || '[]'); } catch (e) { return []; } }
function saveSkills(l) { try { localStorage.setItem(SKILLS_KEY, JSON.stringify(l)); } catch (e) {} }
function activateSkill(name) {
  const l = skills();
  const s = l.find(x => x.name === name);
  if (s && !s.active) { s.active = true; saveSkills(l); }
}

/* ================= Tools (estilo MCP) =================
   El modelo emite [[TOOL:nombre]]{"arg":"valor"}[[/TOOL]] y el host
   ejecuta y devuelve el resultado. Errores siempre como "Error: ..." */
const TOOLS = {
  read: { params: 'path*, offset, max_lines', desc: 'lee un archivo del workspace', handler: async a => {
    const fs = vfsLoad();
    if (!(a.path in fs)) return 'Error: file not found: ' + a.path;
    const lines = fs[a.path].split('\n');
    const off = Math.max(0, a.offset | 0);
    const max = a.max_lines ? Math.min(2000, a.max_lines | 0) : 2000;
    const sel = lines.slice(off, off + max);
    if (!sel.length) return '(empty, or offset past end of file)';
    let out = sel.map((l, i) => String(off + i + 1).padStart(6) + '\t' + l.slice(0, 2000)).join('\n');
    if (off + max < lines.length) out += '\n[truncated: ' + (lines.length - off - max) + ' more lines]';
    return out;
  }},
  write: { params: 'path*, content*', desc: 'escribe (sobrescribe) un archivo', handler: async a => {
    const fs = vfsLoad();
    fs[a.path] = String(a.content);
    vfsSave(fs);
    return 'Wrote ' + String(a.content).length + ' bytes to ' + a.path;
  }},
  edit: { params: 'path*, old_string*, new_string*, replace_all', desc: 'reemplazo exacto en un archivo', handler: async a => {
    const fs = vfsLoad();
    if (!(a.path in fs)) return 'Error: file not found: ' + a.path;
    const cur = fs[a.path];
    const n = cur.split(a.old_string).length - 1;
    if (n === 0) return 'Error: old_string not found';
    if (n > 1 && !a.replace_all) return 'Error: old_string not unique (' + n + ' matches); set replace_all or add context';
    fs[a.path] = a.replace_all ? cur.split(a.old_string).join(a.new_string) : cur.replace(a.old_string, a.new_string);
    vfsSave(fs);
    return 'Edited ' + a.path + ' (' + (a.replace_all ? n : 1) + ' replacements)';
  }},
  glob: { params: 'pattern*', desc: 'lista archivos del workspace por máscara', handler: async a => {
    const fs = vfsLoad();
    const re = new RegExp('^' + String(a.pattern).replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
    const out = Object.keys(fs).filter(p => re.test(p.split('/').pop())).sort();
    if (!out.length) return 'No matches for ' + a.pattern;
    return out.slice(0, 200).join('\n') + (out.length > 200 ? '\n[truncated: more matches]' : '');
  }},
  grep: { params: 'pattern*, path', desc: 'busca texto (regex) en archivos del workspace', handler: async a => {
    const fs = vfsLoad();
    let re;
    try { re = new RegExp(a.pattern, 'i'); } catch (e) { return 'Error: invalid regex'; }
    const out = [];
    for (const p of Object.keys(fs).sort()) {
      if (a.path && !p.startsWith(a.path)) continue;
      fs[p].split('\n').forEach((l, i) => { if (re.test(l) && out.length < 200) out.push(p + ':' + (i + 1) + ':' + l); });
    }
    return out.length ? out.join('\n') : 'No matches for ' + a.pattern;
  }},
  web_fetch: { params: 'url*', desc: 'descarga una URL (HTML/texto, cap 30 KB)', handler: async a => {
    const resp = await fetch('https://api.fivetechsoft.com/webfetch.php?url=' + encodeURIComponent(a.url));
    const txt = await resp.text();
    if (!resp.ok) return 'Error: HTTP ' + resp.status + ': ' + txt.slice(0, 200);
    return txt;
  }},
  web_search: { params: 'query*, max_results', desc: 'busca en Wikipedia (ES y EN); para otras webs usa web_fetch con la URL', handler: async a => {
    const max = Math.min(20, a.max_results | 0 || 8);
    const out = [];
    for (const lang of ['es', 'en']) {
      const u = 'https://' + lang + '.wikipedia.org/w/api.php?action=query&list=search&srsearch=' +
        encodeURIComponent(a.query) + '&format=json&srlimit=' + max;
      let resp;
      try { resp = await fetch('https://api.fivetechsoft.com/webfetch.php?url=' + encodeURIComponent(u)); }
      catch (e) { continue; }
      if (!resp.ok) continue;
      let j;
      try { j = JSON.parse(await resp.text()); } catch (e) { continue; }
      for (const r of ((j.query && j.query.search) || [])) {
        if (out.length >= max) break;
        const snip = r.snippet.replace(/<[^>]+>/g, '');
        out.push(r.title + ' [' + lang + ']\n' + snip + '\nhttps://' + lang + '.wikipedia.org/wiki/' + encodeURIComponent(r.title.replace(/ /g, '_')));
      }
      if (out.length >= max) break;
    }
    return out.length ? out.join('\n\n') : 'Sin resultados para: ' + a.query + ' (prueba web_fetch con una URL concreta)';
  }},
  memory: { params: 'operation* (append|read|clear), text', desc: 'memoria persistente del agente', handler: async (a, agent) => {
    agent.memory = agent.memory || '';
    if (a.operation === 'append') { agent.memory += (agent.memory ? '\n' : '') + (a.text || ''); saveAgents(); return 'Remembered.'; }
    if (a.operation === 'clear') { agent.memory = ''; saveAgents(); return 'Memory cleared.'; }
    return agent.memory || '(memory is empty)';
  }},
  todo_write: { params: 'todos* (array de {text, status})', desc: 'actualiza la lista de tareas del equipo', handler: async a => {
    const list = Array.isArray(a.todos) ? a.todos : [];
    try { localStorage.setItem(TODO_KEY, JSON.stringify(list)); } catch (e) {}
    if (!list.length) return '(todo list cleared)';
    return list.map(t => (t.status === 'completed' ? '[x] ' : t.status === 'in_progress' ? '[>] ' : '[ ] ') + t.text).join('\n');
  }},
  ask_user: { params: 'question*, options* (2-4)', desc: 'pregunta al usuario con opciones', handler: async a => {
    return await askUserModal(a.question, Array.isArray(a.options) ? a.options : []);
  }},
  use_skill: { params: 'name*', desc: 'activa un skill y recibe sus instrucciones', handler: async a => {
    const sk = skills().find(s => s.name === a.name);
    if (!sk) return "Error: skill '" + a.name + "' not found";
    activateSkill(sk.name);
    return "Skill '" + sk.name + "' activated. Follow these instructions:\n\n" + sk.body;
  }}
};
const TOOL_MAX_OUTPUT = 8000;

function toolsSystem() {
  return 'Herramientas disponibles. Para usar una herramienta escribe EXACTAMENTE:\n' +
    '[[TOOL:nombre]]{"param":"valor"}[[/TOOL]]\n' +
    'Ejemplo:\n[[TOOL:write]]{"path":"notas.md","content":"# Notas"}[[/TOOL]]\n' +
    'Puedes usar varias en un mensaje. Tras ejecutarse recibirás los resultados y continuarás.\n' +
    'Tools:\n' + Object.keys(TOOLS).map(k => '- ' + k + '(' + TOOLS[k].params + '): ' + TOOLS[k].desc).join('\n') + '\n\n';
}

function skillsSystem() {
  const list = skills();
  if (!list.length) return '';
  let s = 'Skills disponibles (actívalos con la tool use_skill solo cuando apliquen claramente):\n' +
    list.map(x => '- ' + x.name + ': ' + x.description).join('\n') + '\n';
  for (const x of list.filter(x => x.active)) {
    s += '\nSkill "' + x.name + '" ACTIVO — sigue estas instrucciones:\n' + x.body + '\n';
  }
  return s + '\n';
}

function extractTools(text) {
  const calls = [];
  const re = /\[\[TOOL:([^\]\n]+?)\]\]?\s*([\s\S]*?)(?:\[\[\/TOOL\]\]?|(?=\[\[TOOL:)|$)/gi;
  let m;
  while ((m = re.exec(text)) !== null) {
    const name = m[1].trim();
    let args = {};
    const raw = m[2].trim();
    if (raw) { try { args = JSON.parse(raw); } catch (e) { args = { _raw: raw }; } }
    if (TOOLS[name]) calls.push({ name, args });
    if (m[0].length === 0) re.lastIndex++;
  }
  /* formato nativo de algunos modelos: <tool_call>nombre<arg_key>k</arg_key><arg_value>v</arg_value>...</tool_call>
     o bien <tool_call>{"name":"...","arguments":{...}}</tool_call> */
  const re2 = /<tool_call>\s*([\s\S]*?)(?:<\/tool_call>|(?=<tool_call>)|$)/gi;
  while ((m = re2.exec(text)) !== null) {
    const body = m[1].trim();
    let name = null, args = {};
    if (body.startsWith('{')) {
      try {
        const j = JSON.parse(body);
        name = j.name || j.tool;
        args = j.arguments || j.args || j.parameters || {};
      } catch (e) {}
    } else {
      const nm = body.match(/^([A-Za-z_][\w-]*)/);
      if (nm) name = nm[1];
      const argRe = /<arg_key>([\s\S]*?)<\/arg_key>\s*<arg_value>([\s\S]*?)<\/arg_value>/gi;
      let am;
      while ((am = argRe.exec(body)) !== null) {
        let v = am[2].trim();
        try { v = JSON.parse(v); } catch (e) {}
        args[am[1].trim()] = v;
      }
    }
    if (name && TOOLS[name]) calls.push({ name, args });
    if (m[0].length === 0) re2.lastIndex++;
  }
  const clean = text.replace(re, '').replace(re2, '').replace(/\n{3,}/g, '\n\n').trim();
  return { calls, clean };
}

/* Modal de ask_user: pregunta con botones de opción */
function askUserModal(question, options) {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.id = 'ask-bg'; bg.className = 'open';
    const modal = document.createElement('div');
    modal.id = 'modal';
    const h = document.createElement('h3');
    h.textContent = question;
    const opts = document.createElement('div');
    opts.id = 'ask-opts';
    const done = txt => { bg.remove(); resolve(txt); };
    options.slice(0, 4).forEach(o => {
      const b = document.createElement('button');
      b.className = 'tb-btn'; b.textContent = o;
      b.onclick = () => done('The user selected: ' + o);
      opts.appendChild(b);
    });
    const cancel = document.createElement('button');
    cancel.className = 'tb-btn'; cancel.textContent = '(cancelar)';
    cancel.onclick = () => done('User cancelled the question. Drop this line of questioning and continue differently.');
    opts.appendChild(cancel);
    modal.appendChild(h); modal.appendChild(opts);
    bg.appendChild(modal);
    document.body.appendChild(bg);
  });
}

/* ================= Protocolo ASK ================= */
function extractAsks(text) {
  const asks = [];
  /* tolerante: el cierre [[/ASK]] es opcional (si falta, la pregunta llega
     hasta el próximo [[ASK: o el final); acepta minúsculas */
  const re = /\[\[ASK:([^\]\n]+)\]\]\s*([\s\S]*?)(?:\[\[\/ASK\]\]|(?=\[\[ASK:)|$)/gi;
  let m;
  while ((m = re.exec(text)) !== null) {
    const q = m[2].trim();
    if (q) asks.push({ name: m[1].trim(), q });
    if (m[0].length === 0) re.lastIndex++;
  }
  const clean = text.replace(re, '').replace(/\n{3,}/g, '\n\n').trim();
  return { asks, clean };
}

function findAgentByName(name) {
  const n = name.toLowerCase();
  return agents.find(a => a.name.toLowerCase() === n) ||
         agents.find(a => a.name.toLowerCase().startsWith(n) || n.startsWith(a.name.toLowerCase())) ||
         null;
}

/* Turno completo de un agente: responde, y si puede, consulta a otros y resume */
async function talkTo(agent, userText, allowAsk, depth) {
  agent.busy = true;
  renderSidebar(); updateSendBtn();
  if (agent.id === currentId) thinkingEl.style.display = 'block';
  try {
    const res = await callAgent(agent, userText, allowAsk, abortCtrl ? abortCtrl.signal : undefined);
    thinkingEl.style.display = 'none';
    if (!res) {
      addMsgTo(agent, { r: 'err', t: 'Todos los modelos gratuitos están ocupados. Inténtalo en un rato.' });
      return '';
    }
    const { calls, clean: cleanT } = extractTools(res.text);
    const { asks, clean } = extractAsks(cleanT);
    const u = res.usage && res.usage.total_tokens
      ? 'tokens: ' + (res.usage.prompt_tokens || '?') + '↑ ' + (res.usage.completion_tokens || '?') + '↓ · ' : '';
    const botMsg = { r: 'bot', t: clean, usage: u + agent.name + ' · via ' + res.usedModel };

    if (!clean && (asks.length || calls.length)) {
      /* el turno solo contenía ASKs: no mostrar burbuja vacía */
      if (res.liveDiv) res.liveDiv.remove();
    } else if (res.liveDiv) {
      /* burbuja ya pintada por streaming: fijar texto final sin bloques ASK */
      res.liveDiv.dataset.raw = clean;
      res.liveDiv.innerHTML = renderMd(clean);
      const uEl = document.createElement('div');
      uEl.className = 'usage'; uEl.textContent = botMsg.usage;
      res.liveDiv.appendChild(uEl);
      const cp = bubbleEl({ r: 'bot', t: '' }).querySelector('.copy-btn');
      if (cp) res.liveDiv.appendChild(cp);
      botMsg.ts = Date.now();
      const tsEl = document.createElement('div');
      tsEl.className = 'ts'; tsEl.textContent = fmtTs(botMsg.ts);
      res.liveDiv.appendChild(tsEl);
      agent.msgs.push(botMsg);
      saveAgents();
    } else {
      addMsgTo(agent, botMsg);
    }

    /* Ejecución de tools (antes que las consultas ASK) */
    if (calls.length && depth < 4) {
      const results = [];
      for (const c of calls) {
        addMsgTo(agent, { r: 'tool', t: '⚙ ' + c.name + ' ' + JSON.stringify(c.args).slice(0, 200) });
        let out;
        try {
          out = String(await TOOLS[c.name].handler(c.args, agent));
        } catch (e) {
          out = 'Error: tool ' + c.name + ' failed: ' + e.message;
        }
        if (out.length > TOOL_MAX_OUTPUT) out = out.slice(0, TOOL_MAX_OUTPUT) + '\n[output truncated]';
        addMsgTo(agent, { r: 'tool', t: '→ ' + out.slice(0, 600) + (out.length > 600 ? '…' : '') });
        results.push('Resultado de ' + c.name + ':\n' + out);
      }
      const next = await talkTo(agent,
        'Resultados de herramientas:\n\n' + results.join('\n\n') + '\n\nContinúa.',
        allowAsk, depth + 1);
      return next || clean;
    }

    if (!allowAsk || !asks.length || depth >= 2) return clean;

    /* Consultas a otros agentes, en paralelo */
    const pending = [];
    for (const ask of asks) {
      if (askBudget-- <= 0) {
        addMsgTo(agent, { r: 'sys', t: 'Presupuesto de consultas entre agentes agotado (' + ASK_BUDGET + ').' });
        break;
      }
      const target = findAgentByName(ask.name);
      if (target && target.id === agent.id) {
        addMsgTo(agent, { r: 'sys', t: 'ASK ignorado: ' + agent.name + ' se ha consultado a sí mismo ("' + ask.name + '").' });
        continue;
      }
      if (!target) {
        addMsgTo(agent, { r: 'sys', t: 'ASK ignorado: no existe el agente "' + ask.name + '".' });
        continue;
      }
      addMsgTo(agent, { r: 'peer', t: '→ ' + target.name + ': ' + ask.q });
      addMsgTo(target, { r: 'peer', t: '← ' + agent.name + ': ' + ask.q });
      pending.push({ target, q: ask.q });
    }
    const replies = [];
    await Promise.all(pending.map(p =>
      talkTo(p.target, 'Mensaje de ' + agent.name + ':\n' + p.q, false, depth + 1)
        .then(r => {
          if (r) {
            addMsgTo(agent, { r: 'peer', t: '← ' + p.target.name + ': ' + r });
            replies.push(p.target.name + ' respondió:\n' + r);
          }
        })
    ));
    if (replies.length) {
      return await talkTo(agent,
        'Respuestas del equipo a tus consultas:\n\n' + replies.join('\n\n') +
        '\n\nAhora responde al usuario resumiendo lo relevante.', askBudget > 0, depth + 1) || clean;
    }
    return clean;
  } finally {
    agent.busy = false;
    renderSidebar(); updateSendBtn();
    if (agent.id === currentId) messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

/* ================= Envío del usuario ================= */
async function sendMessage() {
  const text = promptEl.value.trim();
  const a = cur();
  if (!text || !a || a.busy) return;
  if (text.startsWith('/')) { handleCommand(text); return; }

  promptHistory.push(text);
  if (promptHistory.length > 100) promptHistory.shift();
  promptHistIdx = promptHistory.length;
  try { localStorage.setItem(PROMPT_HIST_KEY, JSON.stringify(promptHistory)); } catch (e) {}

  promptEl.value = '';
  autoGrow();
  addMsgTo(a, { r: 'user', t: text });

  /* auto-activación de skills por triggers regex sobre el mensaje */
  const skList = skills();
  let skChanged = false;
  for (const sk of skList) {
    if (sk.active || !sk.triggers) continue;
    const hit = sk.triggers.split(',').some(t => {
      try { return new RegExp(t.trim(), 'i').test(text); } catch (e) { return false; }
    });
    if (hit) {
      sk.active = true; skChanged = true;
      addMsgTo(a, { r: 'sys', t: "Skill '" + sk.name + "' auto-activado (coincide con tu mensaje)." });
    }
  }
  if (skChanged) saveSkills(skList);

  askBudget = ASK_BUDGET;
  abortCtrl = new AbortController();
  updateSendBtn();

  try {
    await talkTo(a, text, true, 0);
  } catch (e) {
    thinkingEl.style.display = 'none';
    if (e.name === 'AbortError') addMsgTo(a, { r: 'sys', t: 'Cancelado.' });
    else addMsgTo(a, { r: 'err', t: 'Error de red: ' + e.message });
  }
  abortCtrl = null;
  updateSendBtn();
  promptEl.focus();
}

/* ================= Diseño de equipo con IA ================= */
async function designTeam(topic) {
  topic = (topic || '').trim();
  if (!topic) return;
  const sysMsg = 'Diseña un equipo de 3 a 6 agentes especializados para este objetivo: "' + topic + '".\n' +
    'Cada agente: name (corto, sin espacios), role (qué hace, 1 línea), level (1 = líder, 2-3 = staff), ' +
    'reports (nombre de su jefe o ""), leads (nombres separados por coma o "").\n' +
    'Exactamente un líder level 1. Nada de cargos genéricos tipo "Jefe".\n' +
    'Responde SOLO con JSON válido:\n' +
    '{"agents":[{"name":"...","role":"...","level":1,"reports":"","leads":"A, B"}]}';
  addMsgTo(cur(), { r: 'sys', t: 'Diseñando equipo para: ' + topic.trim() + ' …' });
  let spec = null;
  for (const m of FREE_MODELS) {
    try {
      const resp = await fetch(endpoint() + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey() },
        body: JSON.stringify({ model: m, messages: [{ role: 'user', content: sysMsg }], max_tokens: 2048, stream: false })
      });
      if (!resp.ok) continue;
      const data = await resp.json();
      const txt = data.choices?.[0]?.message?.content || '';
      const s = txt.indexOf('{'), e2 = txt.lastIndexOf('}');
      if (s < 0 || e2 < 0) continue;
      const j = JSON.parse(txt.slice(s, e2 + 1));
      const list = j.agents || j.team;
      if (Array.isArray(list) && list.length >= 3) { spec = list.slice(0, 7); break; }
    } catch (e) { /* siguiente modelo */ }
  }
  if (!spec) {
    spec = [
      { name: 'Lead', role: 'Lidera el equipo para: ' + topic.trim() + '. Coordina y resume.', level: 1, reports: '', leads: 'Maker, Reviewer' },
      { name: 'Maker', role: 'Ejecuta el trabajo técnico principal de: ' + topic.trim(), level: 2, reports: 'Lead', leads: '' },
      { name: 'Reviewer', role: 'Revisa el trabajo de Maker: calidad, errores y mejoras de: ' + topic.trim(), level: 2, reports: 'Lead', leads: '' }
    ];
    addMsgTo(cur(), { r: 'sys', t: 'La IA no devolvió un equipo válido; uso equipo genérico.' });
  }
  agents = [];
  spec.forEach((s, i) => {
    const a = newAgent(s.name || ('Agent' + (i + 1)), s.role || 'Agente del equipo.', FREE_MODELS[i % 2]);
    a.level = s.level || 0;
    a.reports = s.reports || '';
    a.leads = s.leads || '';
  });
  const lead = agents.find(a => a.level === 1) || agents[0];
  currentId = lead.id;
  try { localStorage.setItem(TEAM_KEY, topic); } catch (e) {}
  updateTeamDesc();
  saveAgents(); renderSidebar(); renderChat(); updateModelTag(); updateRoleBar(); updateSendBtn();
  addMsgTo(lead, { r: 'sys', t: 'Equipo creado: ' + agents.map(a => a.name).join(', ') + '.\nHabla con ' + lead.name + ' (★) y él consultará al equipo.' });
}

    el.textContent = '⌂ ' + topic;

/* ================= Modo ambiente =================
   Cada intervalo aleatorio (90-240 s) un agente toma la palabra:
   formula una pregunta a un compañero (ASK) o lanza una propuesta. */
let ambientTimer = null;
const ambientEnabled = () => cfg.ambient !== false;

function scheduleAmbient() {
  clearTimeout(ambientTimer);
  if (!ambientEnabled()) return;
  const delay = 90000 + Math.random() * 150000;
  ambientTimer = setTimeout(ambientTick, delay);
}

async function ambientTick() {
  scheduleAmbient();
  if (agents.length < 2 || agents.some(a => a.busy) || abortCtrl) return;
  const a = agents[Math.floor(Math.random() * agents.length)];
  askBudget = 4;
  abortCtrl = new AbortController();
  updateSendBtn();
  try {
    await talkTo(a,
      '[Turno espontáneo — no escribe el usuario] Formula UNA pregunta breve a un compañero del equipo ' +
      '(usa ASK con su nombre) o lanza UNA propuesta breve relacionada con tu rol y el objetivo del equipo. ' +
      'Una sola intervención, sé conciso.',
      true, 0);
  } catch (e) { /* el modo ambiente nunca muestra errores */ }
  abortCtrl = null;
  updateSendBtn();
}

function updateAmbientBtn() {
  $('btn-ambient').classList.toggle('on', ambientEnabled());
  $('btn-ambient').textContent = ambientEnabled() ? '⏸' : '⏵';
  $('btn-ambient').title = ambientEnabled()
    ? 'Modo ambiente ACTIVO: los agentes hablan solos cada 1,5-4 min. Pulsar para pausar.'
    : 'Modo ambiente en pausa. Pulsar para activar (los agentes hablan solos).';
}

/* ================= Comandos ================= */
const COMMANDS = [
  { cmd: '/help',    desc: 'mostrar comandos' },
  { cmd: '/clear',   desc: 'limpiar el chat del agente actual' },
  { cmd: '/agents',  desc: 'lista de agentes del equipo' },
  { cmd: '/models',  desc: 'elegir modelo del agente actual (lista en vivo)' },
  { cmd: '/model',   desc: '/model <id> — fijar modelo del agente actual' },
  { cmd: '/role',    desc: '/role <texto> — cambiar el rol del agente actual' },
  { cmd: '/key',     desc: '/key <apikey> — tu key de opencode.ai/zen' },
  { cmd: '/endpoint',desc: '/endpoint <url> — cambiar endpoint proxy' },
  { cmd: '/skills',  desc: 'abrir el panel de skills' },
  { cmd: '/files',   desc: 'abrir el workspace de archivos' },
  { cmd: '/reset',   desc: 'borrar todo (agentes, config, chats)' }
];

function handleCommand(text) {
  const parts = text.split(/\s+/);
  const c = parts[0], arg = text.slice(c.length).trim();
  const a = cur();
  promptEl.value = ''; autoGrow();
  switch (c) {
    case '/help':
      addMsgTo(a, { r: 'sys', t: COMMANDS.map(x => x.cmd.padEnd(10) + ' ' + x.desc).join('\n') +
        '\n\nLos agentes pueden consultarse entre sí con el protocolo ASK y usar tools ([[TOOL:...]]).\n✨ = diseñar equipo con IA · + = nuevo agente · ⏵ = modo ambiente\n📚 = skills · 📁 = workspace de archivos' });
      break;
    case '/clear':
      a.msgs = [];
      saveAgents(); renderChat();
      addMsgTo(a, { r: 'sys', t: 'Chat de ' + a.name + ' limpio.' });
      break;
    case '/agents':
      addMsgTo(a, { r: 'sys', t: agents.map(x =>
        (x.id === currentId ? '→ ' : '  ') + x.name + (x.level === 1 ? ' ★' : '') +
        ' [' + x.model + ']' + (x.reports ? ' reporta a ' + x.reports : '') +
        '\n    ' + x.role.slice(0, 80)).join('\n') });
      break;
    case '/models':
      pickModel();
      break;
    case '/model':
      if (!arg) { addMsgTo(a, { r: 'sys', t: 'Uso: /model <id>\nActual: ' + a.model }); break; }
      a.model = arg; saveAgents(); updateModelTag(); renderSidebar();
      addMsgTo(a, { r: 'sys', t: a.name + ' ahora usa: ' + arg });
      break;
    case '/role':
      if (!arg) { addMsgTo(a, { r: 'sys', t: 'Rol actual:\n' + a.role }); break; }
      a.role = arg; saveAgents(); updateRoleBar();
      addMsgTo(a, { r: 'sys', t: 'Rol de ' + a.name + ' actualizado.' });
      break;
    case '/key':
      if (!arg) { addMsgTo(a, { r: 'sys', t: cfg.apiKey ? 'Key propia configurada (…' + cfg.apiKey.slice(-4) + ')' : 'Sin key propia — usando "public" (free).' }); break; }
      cfg.apiKey = arg; saveCfg(cfg);
      addMsgTo(a, { r: 'sys', t: 'API key guardada.' });
      break;
    case '/endpoint':
      if (!arg) { addMsgTo(a, { r: 'sys', t: 'Endpoint: ' + endpoint() }); break; }
      cfg.endpoint = arg.replace(/\/+$/, ''); saveCfg(cfg);
      addMsgTo(a, { r: 'sys', t: 'Endpoint: ' + cfg.endpoint });
      break;
    case '/skills':
      renderSkillsList();
      $('skills-bg').classList.add('open');
      break;
    case '/files':
      renderFilesList();
      $('files-bg').classList.add('open');
      break;
    case '/reset':
      localStorage.removeItem(CFG_KEY);
      localStorage.removeItem(AGENTS_KEY);
      localStorage.removeItem(CURRENT_KEY);
      localStorage.removeItem(TEAM_KEY);
      localStorage.removeItem(SKILLS_KEY);
      localStorage.removeItem(VFS_KEY);
      localStorage.removeItem(TODO_KEY);
      location.reload();
      break;
    default:
      addMsgTo(a, { r: 'sys', t: 'Comando desconocido: ' + c + ' — prueba /help' });
  }
}

/* ================= Model picker ================= */
async function pickModel() {
  const a = cur();
  addMsgTo(a, { r: 'sys', t: 'Cargando modelos…' });
  try {
    const resp = await fetch(endpoint() + '/models', {
      headers: { 'Authorization': 'Bearer ' + apiKey() }
    });
    const data = await resp.json();
    const ids = (data.data || []).map(x => x.id);
    const free = FREE_MODELS.filter(m => ids.includes(m));
    const rest = ids.filter(m => !free.includes(m)).sort();
    showPicker(free.concat(rest), id => {
      a.model = id; saveAgents(); updateModelTag(); renderSidebar();
      addMsgTo(a, { r: 'sys', t: a.name + ' ahora usa: ' + id });
    });
  } catch (e) {
    addMsgTo(a, { r: 'err', t: 'No se pudo cargar la lista: ' + e.message });
  }
}

function showPicker(items, onPick) {
  cmdList.innerHTML = '';
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'cmd-item' + (i === 0 ? ' sel' : '');
    d.textContent = it + (FREE_MODELS.includes(it) ? ' · free' : '');
    d.onclick = () => { hidePicker(); onPick(it); };
    cmdList.appendChild(d);
  });
  cmdList.style.display = 'block';
  cmdList.dataset.mode = 'picker';
  cmdList._onPick = onPick;
  cmdList._items = items;
  cmdList._sel = 0;
}

function showCmdPicker(filter) {
  const items = COMMANDS.filter(x => x.cmd.startsWith(filter));
  if (!items.length) { hidePicker(); return; }
  cmdList.innerHTML = '';
  items.forEach((x, i) => {
    const d = document.createElement('div');
    d.className = 'cmd-item' + (i === 0 ? ' sel' : '');
    d.innerHTML = esc(x.cmd) + '<span class="desc">' + esc(x.desc) + '</span>';
    d.onclick = () => { hidePicker(); promptEl.value = x.cmd + ' '; promptEl.focus(); };
    cmdList.appendChild(d);
  });
  cmdList.style.display = 'block';
  cmdList.dataset.mode = 'commands';
  cmdList._items = items.map(x => x.cmd);
  cmdList._sel = 0;
}

function hidePicker() { cmdList.style.display = 'none'; cmdList.dataset.mode = ''; }

function pickerNav(dir) {
  const items = cmdList.querySelectorAll('.cmd-item');
  if (!items.length) return;
  cmdList._sel = (cmdList._sel + dir + items.length) % items.length;
  items.forEach((el, i) => el.classList.toggle('sel', i === cmdList._sel));
  items[cmdList._sel].scrollIntoView({ block: 'nearest' });
}

function pickerAccept() {
  const mode = cmdList.dataset.mode;
  const val = cmdList._items[cmdList._sel];
  hidePicker();
  if (mode === 'commands') { promptEl.value = val + ' '; }
  else if (mode === 'picker' && cmdList._onPick) cmdList._onPick(val);
  promptEl.focus();
}

    tog.onclick = e => {
      e.stopPropagation();

  if (v.startsWith('/') && !v.includes(' ') && !v.includes('\n')) showCmdPicker(v);
  else hidePicker();
});

promptEl.addEventListener('keydown', e => {
  if (cmdList.style.display === 'block') {
    if (e.key === 'ArrowDown') { pickerNav(1); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { pickerNav(-1); e.preventDefault(); return; }
    if (e.key === 'Tab') { pickerAccept(); e.preventDefault(); return; }
    if (e.key === 'Enter') {
      /* si el comando ya está escrito completo, enviar directo; si no, copiar al prompt */
      if (cmdList.dataset.mode === 'commands' && promptEl.value.trim() === cmdList._items[cmdList._sel]) {
        hidePicker();
      } else {
        pickerAccept(); e.preventDefault(); return;
      }
    }
    if (e.key === 'Escape') { hidePicker(); e.preventDefault(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); return; }
  if (e.key === 'Escape' && abortCtrl) { abortCtrl.abort(); return; }
  if (e.key === 'ArrowUp' && promptEl.value === '' && promptHistIdx > 0) {
    promptHistIdx--;
    promptEl.value = promptHistory[promptHistIdx] || '';
    autoGrow(); e.preventDefault();
  }
  if (e.key === 'ArrowDown' && promptHistIdx < promptHistory.length) {
    promptHistIdx++;
    promptEl.value = promptHistory[promptHistIdx] || '';
    autoGrow(); e.preventDefault();
  }
});

document.addEventListener('keydown', e => {

    $('modal-bg').classList.remove('open');

  if (!cmdList.contains(e.target) && e.target !== promptEl && e.target !== modelTag) hidePicker();
});

if (window.innerWidth < 700) $('sidebar').classList.add('hidden');

/* ================= Init ================= */
try { promptHistory = JSON.parse(localStorage.getItem(PROMPT_HIST_KEY) || '[]'); } catch (e) {}
promptHistIdx = promptHistory.length;
loadAgents();
if (!localStorage.getItem(SKILLS_KEY)) {
  saveSkills([{
    name: 'revision-codigo',
    description: 'Checklist para revisar código antes de darlo por bueno',
    triggers: 'revisa,review',
    body: '# Revisión de código\nChecklist:\n1. Comprueba errores de lógica y casos límite\n2. Nombres claros y consistentes\n3. Sin código duplicado innecesario\n4. Comenta solo lo no obvio\n5. Reporta hallazgos ordenados por severidad'
  }]);
}
renderSidebar();
renderChat();
updateModelTag();
updateRoleBar();
updateTeamDesc();
updateSendBtn();
updateAmbientBtn();
scheduleAmbient();
if (cur() && !cur().msgs.length) {
  addMsgTo(cur(), { r: 'sys', t:
    'FiveTech Agent — equipo de agentes IA (OpenCode Zen, gratis sin login).\n' +
    'Crea agentes con + o diseña un equipo con ✨. Los agentes se consultan entre sí.\n' +
    '/help para comandos. Modelo: ' + cur().model });
}
promptEl.focus();
</script>
